name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-js
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run gen:types
      - run: bun run check:types
      - run: bunx tsc -p tsconfig.examples.json
      - name: await-guard (the webhook example must await verifyWebhookSignature)
        run: |
          grep -q 'await verifyWebhookSignature' examples/webhook.ts
          ! grep 'verifyWebhookSignature(' examples/webhook.ts | grep -qv await
      - run: bun run build
      - run: bun run test
      - run: bun run lint
      - run: npm pack --dry-run

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run python ../../scripts/check-python-contract-fresh.py
      - run: uv run python -m build
      - run: uv run twine check --strict dist/*
      - run: uv run pytest tests/test_package_install.py -q
