[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smscode"
version = "1.2.0"
description = "Official Python SDK for the SMSCode virtual number API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SMSCode", email = "dev@smscode.gg" }]
keywords = [
  "smscode",
  "sms",
  "otp",
  "virtual-number",
  "phone-verification",
  "2fa",
  "sms-verification",
  "api-client",
  "sdk",
  "python",
  "receive-sms-online",
  "sms-otp",
  "temporary-phone-number",
  "virtual-phone-number",
  "online-sms",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://smscode.gg"
Documentation = "https://smscode.gg/docs/ai.md"
Repository = "https://github.com/smscode-gg/sdks"
Issues = "https://github.com/smscode-gg/sdks/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pyyaml>=6", "jsonschema>=4.18"]
lint = ["ruff>=0.8"]
type = ["mypy>=1.11"]
build = ["build>=1.2", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/smscode"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/smscode",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["smscode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
